version: '3.8'

services:
  mysql-admin:
    image: mysql:8.0
    container_name: admin-financeiro-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: admin_financeiro
      MYSQL_USER: admin_app
      MYSQL_PASSWORD: SuaSenhaForte123!
    ports:
      - "3308:3306"   # Porta 3307 no seu PC para não conflitar com nada
    volumes:
      - admin_db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  admin_db_data:
    driver: local
